name: Fuzz
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang
      - name: Configure
        env:
          CXX: clang++
        run: cmake -S . -B build -DT27_BUILD_FUZZ=ON -DT27_BUILD_TESTS=OFF
      - run: cmake --build build --target t27_fuzz_div --parallel 2
      - name: Check arithmetic invariants
        run: ./build/t27_fuzz_div -max_total_time=30 -timeout=5
