name: Core CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        config: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DT27_BUILD_TESTS=ON -DT27_BUILD_BENCH=ON -DT27_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel 2
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure
      - name: Check installed consumer
        run: python tools/check_install.py build ${{ matrix.config }}
      - name: Package
        working-directory: build
        run: cpack -C ${{ matrix.config }} -G ZIP
      - uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.os }}-${{ matrix.config }}
          path: build/*.zip
          if-no-files-found: error
