site_name: Ternary Computer (T27)
site_url: https://dasaelektronik.github.io/T27/
repo_url: https://github.com/DASAElektronik/T27
repo_name: DASAElektronik/T27
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - search.highlight
    - header.autohide
  logo: assets/t27_logo.svg
  favicon: assets/t27_favicon.png
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/white-balance-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Guide:
      - Quickstart: guide/quickstart.md
      - Migration to 0.2: guide/migration-0.2.md
      - Examples: guide/examples.md
      - Glossary: guide/glossary.md
      - Credits: guide/credits.md
      - Contributing: guide/contributing.md
      - Licensing: guide/licensing.md
      - Governance: guide/governance.md
  - Design:
      - Architecture: design/architecture.md
      - Numeric contract: design/numeric-contract.md
      - Cells & Encoding: design/cells.md
      - Non-Infringement Scope: design/ip-scope.md
      - Long Division Algorithm: design/alg-long-div.md
      - Proof (Long Division): design/proof_long_div.md
  - Floating-point RFCs:
      - Status and open decisions: rfcs/float-status.md
      - Ternary27 draft: rfcs/fp-ternary27.md
      - Ternary6 draft: rfcs/fp-ternary6.md
  - API reference: api/index.html
  - Reproducibility:
      - Tooling & Versions: repro/tooling.md
      - Tests & CI: repro/tests-ci.md
      - Project review: repro/review-2026-10-05.md
  - Roadmap: roadmap.md

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - codehilite
  - pymdownx.details
  - pymdownx.superfences
  - attr_list

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DASAElektronik/T27
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/daniel-schuch-a710418b/
    - icon: fontawesome/brands/github
      link: https://github.com/DASAElektronik/T27/discussions
      name: GitHub Discussions

exclude_docs: |
  requirements.txt
  Doxyfile
  api-main.md
  t27_groups.dox
  design/snippets/
validation:
  nav:
    not_found: warn
    omitted_files: info
  links:
    not_found: warn
